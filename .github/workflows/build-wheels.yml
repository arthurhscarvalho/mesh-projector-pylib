name: Build and Publish Python Wheels

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Checkout Python binding
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r} (optionally prefixed with 'v').")

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=3,<4"

      - name: Build and test wheels
        env:
          CIBW_BUILD: cp311-* cp312-*
          CIBW_SKIP: '*-musllinux_* *_i686 *-win32'
          CIBW_ARCHS: auto64
          CIBW_BEFORE_ALL_LINUX: >-
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- --default-toolchain stable --profile minimal -y
          CIBW_ENVIRONMENT_LINUX: 'PATH=$HOME/.cargo/bin:$PATH'
          CIBW_TEST_COMMAND: >-
            python -c "import mesh_projector as mp; assert callable(mp.project_to_images); assert callable(mp.project_to_point_cloud)"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish_wheels:
    name: Publish wheels to PyPI
    needs: build_wheels
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheels artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Twine
        run: python -m pip install --upgrade twine

      - name: Check distributions
        run: python -m twine check dist/*.whl

      - name: Publish distributions to PyPI
        env:
          TWINE_USERNAME: __token__
          # Configure this secret in the mesh-projector-pylib repository.
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: python -m twine upload --skip-existing dist/*.whl
