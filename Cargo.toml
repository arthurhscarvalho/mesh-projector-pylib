[package]
name = "mesh_projector"
version = "0.5.0"
edition = "2021"

[lib]
name = "mesh_projector"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.24.0"
ndarray = "0.16.1"
rayon = "1.10.0"
log = "0.4.27"
colog = "1.3.0"

[dependencies.mesh-projector-core]
path = "../mesh-projector-rs/crates/core"

[dependencies.mesh-projector-cpu]
path = "../mesh-projector-rs/crates/cpu"

[dependencies.mesh-projector-wgpu]
path = "../mesh-projector-rs/crates/wgpu"

[dependencies.pyo3]
version = "0.24.1"
features = ["extension-module"]
