[dependencies]
numpy = "0.24.0"
rayon = "1.10.0"
log = "0.4.27"
colog = "1.3.0"

[dependencies.mesh_projector]
path = "../mesh-projector-rs/"

[dependencies.pyo3]
version = "0.24.1"
features = ["extension-module"]
